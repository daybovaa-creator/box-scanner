<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сборка - Box Scanner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Сборочный лист</h1>
            <a href="index.html" class="btn btn-secondary">← Назад</a>
        </header>
        <main>
            <div class="card">
                <div class="card-header">Вставьте артикулы из Ozon</div>
                <p>Скопируйте артикулы из сборочного листа и вставьте сюда (по одному на строку):</p>
                <div class="form-group">
                    <textarea id="articles-input" class="form-control" rows="10" placeholder="СС5-00001&#10;СС5-00002&#10;СС5-00003"></textarea>
                </div>
                <button onclick="generateRoute()" class="btn btn-primary" style="width: 100%;">🗺️ Построить маршрут</button>
            </div>
            <div id="route-results"></div>
        </main>
    </div>
    <script src="db.js"></script>
    <script>
        (async () => { await DB.init(); })();
        async function generateRoute() {
            const input = document.getElementById('articles-input').value.trim();
            const resultsDiv = document.getElementById('route-results');
            if (!input) { alert('Вставьте артикулы'); return; }
            resultsDiv.innerHTML = '<div class="card"><p style="text-align: center;">⏳ Построение маршрута...</p></div>';
            try {
                const articles = input.split('\n').map(line => line.trim()).filter(line => line.length > 0);
                if (articles.length === 0) { alert('Не найдено ни одного артикула'); return; }
                const route = new Map(), notFound = [], notPlaced = [];
                for (const article of articles) {
                    const product = await DB.products.getByArticle(article);
                    if (!product) { notFound.push(article); continue; }
                    const boxes = await DB.search.findBoxesByProduct(product.id);
                    if (boxes.length === 0) { notPlaced.push({article, name: product.name}); continue; }
                    const boxItem = boxes[0], boxCode = boxItem.box.code;
                    if (!route.has(boxCode)) route.set(boxCode, {box: boxItem.box, items: []});
                    route.get(boxCode).items.push({product: product, available: boxItem.quantity, needed: 1});
                }
                let html = '';
                if (route.size > 0) {
                    const routeArray = Array.from(route.entries());
                    html += `<div class="card"><div class="card-header" style="background: var(--success); color: white;">✅ Маршрут сборки (${routeArray.length} коробок)</div><div style="padding: 1rem;"><p><strong>Всего позиций:</strong> ${routeArray.reduce((sum, [_, data]) => sum + data.items.length, 0)}</p></div></div>`;
                    routeArray.forEach(([boxCode, data], index) => {
                        const totalNeeded = data.items.reduce((sum, item) => sum + item.needed, 0);
                        html += `<div class="card"><div class="card-header" style="background: #3b82f6; color: white;">${index + 1}. Коробка ${boxCode}</div><ul class="items-list" style="margin: 0;">${data.items.map(item => `<li><div><div style="font-weight: 600;">${item.product.article}</div><div style="font-size: 0.9rem; color: var(--text-muted);">${item.product.name}</div><div style="font-size: 0.85rem; color: var(--text-muted);">В коробке: ${item.available} шт.</div></div><div style="font-weight: 600; color: var(--primary); font-size: 1.2rem;">✓ ${item.needed} шт.</div></li>`).join('')}</ul><div style="padding: 1rem; text-align: center; background: var(--bg-secondary); border-top: 1px solid var(--border);"><strong>${data.items.length} позиций</strong> (${totalNeeded} шт.)</div></div>`;
                    });
                }
                if (notPlaced.length > 0) html += `<div class="card"><div class="card-header" style="background: var(--warning); color: white;">⚠️ Не размещены (${notPlaced.length})</div><ul class="items-list" style="margin: 0;">${notPlaced.map(item => `<li><div><div style="font-weight: 600;">${item.article}</div><div style="font-size: 0.9rem; color: var(--text-muted);">${item.name}</div></div><div style="color: var(--warning);">🔍</div></li>`).join('')}</ul></div>`;
                if (notFound.length > 0) html += `<div class="card"><div class="card-header" style="background: var(--danger); color: white;">❌ Не найдены в базе (${notFound.length})</div><ul class="items-list" style="margin: 0;">${notFound.map(article => `<li><div style="font-weight: 600;">${article}</div><div style="color: var(--danger);">❌</div></li>`).join('')}</ul></div>`;
                resultsDiv.innerHTML = html;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="card"><div class="alert alert-danger">❌ Ошибка: ${error.message}</div></div>`;
            }
        }
    </script>
</body>
</html>
