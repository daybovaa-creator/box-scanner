<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск - Box Scanner</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Поиск товара</h1>
            <a href="index.html" class="btn btn-secondary">← Назад</a>
        </header>
        <main>
            <div class="card">
                <div class="card-header">Отсканируйте штрихкод товара</div>
                <div id="barcode-reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
                <p style="text-align: center; margin-top: 1rem; color: var(--text-muted);">Или введите штрихкод вручную:</p>
                <div class="form-group">
                    <input type="text" id="manual-barcode" class="form-control" placeholder="Отсканируйте или введите ШК">
                </div>
                <button onclick="searchProduct()" class="btn btn-primary" style="width: 100%;">🔍 Найти товар</button>
            </div>
            <div id="search-results"></div>
        </main>
    </div>
    <script src="db.js"></script>
    <script>
        let barcodeScanner = null;
        (async () => { await DB.init(); initBarcodeScanner(); })();
        function initBarcodeScanner() {
            barcodeScanner = new Html5Qrcode("barcode-reader");
            barcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, onBarcodeScanned).catch(err => console.error("Barcode scanner error:", err));
        }
        async function onBarcodeScanned(decodedText) { document.getElementById('manual-barcode').value = decodedText; await searchProduct(); }
        async function searchProduct() {
            const barcode = document.getElementById('manual-barcode').value.trim();
            const resultsDiv = document.getElementById('search-results');
            if (!barcode) { alert('Введите штрихкод'); return; }
            resultsDiv.innerHTML = '<div class="card"><p style="text-align: center;">⏳ Поиск...</p></div>';
            try {
                const product = await DB.products.getByBarcode(barcode);
                if (!product) {
                    resultsDiv.innerHTML = `<div class="card"><div class="alert alert-danger">❌ Товар не найден<br><small>Штрихкод: ${barcode}</small></div><p>Возможно товар ещё не добавлен в систему.</p></div>`;
                    return;
                }
                const boxes = await DB.search.findBoxesByProduct(product.id);
                if (boxes.length === 0) {
                    resultsDiv.innerHTML = `<div class="card"><div class="card-header" style="background: var(--warning); color: white;">⚠️ Товар найден, но не размещён</div><div style="padding: 1rem;"><div><strong>Артикул:</strong> ${product.article}</div><div><strong>Название:</strong> ${product.name}</div><p style="margin-top: 1rem; color: var(--text-muted);">Товар есть в базе, но пока не размещён ни в одной коробке.</p></div></div>`;
                    return;
                }
                resultsDiv.innerHTML = `<div class="card"><div class="card-header" style="background: var(--success); color: white;">✅ Товар найден</div><div style="padding: 1rem;"><div><strong>Артикул:</strong> ${product.article}</div><div><strong>Название:</strong> ${product.name}</div>${product.barcode_manufacturer ? `<div><small>ШК производителя: ${product.barcode_manufacturer}</small></div>` : ''}${product.barcode_ozon ? `<div><small>ШК Ozon: ${product.barcode_ozon}</small></div>` : ''}</div></div><div class="card"><div class="card-header">📦 Находится в коробках (${boxes.length}):</div><ul class="items-list">${boxes.map(item => `<li><div><div style="font-weight: 600; font-size: 1.2rem;">${item.box.code}</div><div style="font-size: 0.9rem; color: var(--text-muted);">Добавлено: ${new Date(item.added_at).toLocaleString('ru-RU')}</div></div><div style="font-weight: 600; color: var(--primary); font-size: 1.2rem;">${item.quantity} шт.</div></li>`).join('')}</ul><div style="padding: 1rem; text-align: center; background: var(--bg-secondary); border-radius: 8px; margin-top: 1rem;"><strong>Всего на складе:</strong> ${boxes.reduce((sum, item) => sum + item.quantity, 0)} шт.</div></div>`;
            } catch (error) {
                resultsDiv.innerHTML = `<div class="card"><div class="alert alert-danger">❌ Ошибка: ${error.message}</div></div>`;
            }
        }
    </script>
</body>
</html>
